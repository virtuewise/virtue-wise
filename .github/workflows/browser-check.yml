name: Browser acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Chromium end-to-end acceptance
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and browser test dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Start isolated local application
        env:
          VIRTUE_WISE_DB: /tmp/virtue-wise-browser-test.sqlite3
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/virtue-wise-uvicorn.log 2>&1 &
          echo $! > /tmp/virtue-wise-uvicorn.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/virtue-wise-uvicorn.log
          exit 1
      - name: Run browser acceptance tests
        env:
          VIRTUE_WISE_BASE_URL: http://127.0.0.1:8000
        run: python -m pytest -q browser_tests
      - name: Show application log on failure
        if: failure()
        run: cat /tmp/virtue-wise-uvicorn.log
      - name: Stop local application
        if: always()
        run: |
          if [ -f /tmp/virtue-wise-uvicorn.pid ]; then
            kill "$(cat /tmp/virtue-wise-uvicorn.pid)" || true
          fi

  browser-windows:
    name: Chromium end-to-end acceptance on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and browser test dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install chromium
      - name: Start isolated local application
        env:
          VIRTUE_WISE_DB: ${{ runner.temp }}\virtue-wise-browser-test.sqlite3
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "virtue-wise-uvicorn.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "virtue-wise-uvicorn.stderr.log"
          $pidFile = Join-Path $env:RUNNER_TEMP "virtue-wise-uvicorn.pid"
          $process = Start-Process -FilePath "python" -ArgumentList @(
            "-m", "uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"
          ) -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $process.Id | Set-Content $pidFile
          $ready = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            if ($process.HasExited) {
              break
            }
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000/health" -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                $ready = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $ready) {
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "The isolated local application did not become ready."
          }
      - name: Run browser acceptance tests
        env:
          VIRTUE_WISE_BASE_URL: http://127.0.0.1:8000
        run: python -m pytest -q browser_tests
      - name: Show application log on failure
        if: failure()
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "virtue-wise-uvicorn.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "virtue-wise-uvicorn.stderr.log"
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
      - name: Stop local application
        if: always()
        run: |
          $pidFile = Join-Path $env:RUNNER_TEMP "virtue-wise-uvicorn.pid"
          if (Test-Path $pidFile) {
            $processId = [int](Get-Content $pidFile)
            Stop-Process -Id $processId -Force -ErrorAction SilentlyContinue
          }
