name: Browser acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Chromium end-to-end acceptance
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and browser test dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Start isolated local application
        env:
          VIRTUE_WISE_DB: /tmp/virtue-wise-browser-test.sqlite3
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/virtue-wise-uvicorn.log 2>&1 &
          echo $! > /tmp/virtue-wise-uvicorn.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/virtue-wise-uvicorn.log
          exit 1
      - name: Run browser acceptance tests
        env:
          VIRTUE_WISE_BASE_URL: http://127.0.0.1:8000
        run: python -m pytest -q browser_tests
      - name: Show application log on failure
        if: failure()
        run: cat /tmp/virtue-wise-uvicorn.log
      - name: Stop local application
        if: always()
        run: |
          if [ -f /tmp/virtue-wise-uvicorn.pid ]; then
            kill "$(cat /tmp/virtue-wise-uvicorn.pid)" || true
          fi
