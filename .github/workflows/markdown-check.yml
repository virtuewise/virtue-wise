name: Documentation checks

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  documentation:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify core documentation and links to planned docs
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md ROADMAP.md REPOSITORY_SETUP.md docs/VISION.md docs/PROTOTYPE.md docs/BRAND.md assets/virtue-wise-mark.svg; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done
          grep -q 'docs/PROTOTYPE.md' README.md
          grep -q 'docs/BRAND.md' README.md
          echo "Required repository files and documentation links are present."
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md" ".github/**/*.md"
