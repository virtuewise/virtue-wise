[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "virtue-wise"
version = "0.1.0"
description = "A local-first prototype for inspectable, evidence-aware project models."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "VIRTUE WISE contributors" }]
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic>=2.9,<3.0", "python-multipart>=0.0.18,<1.0"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.3,<9.0", "ruff>=0.7,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
